<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上传转换 — 学术期刊优化平台</title>
<style>
/* ══════ 内嵌样式 ══════ */
/* ═══════════════════════════════════════════════
   学术期刊优化平台 — 设计系统 Platform CSS v1.0
   ===============================================
   覆盖所有页面: 首页 / 浏览 / 上传 / 论文详情 / 关于
   设计风格: 深蓝学术风 + 现代简洁
   ═══════════════════════════════════════════════ */

/* ── CSS 变量（Design Tokens） ── */
:root {
  /* 品牌色 */
  --color-primary:      #0d2b45;
  --color-primary-light:#1a3f5c;
  --color-accent:       #1a5276;
  --color-accent-light: #2e86c1;
  --color-highlight:    #3498db;

  /* 中性色 */
  --color-text:         #1a1a1a;
  --color-text-sub:     #555555;
  --color-text-light:   #888888;
  --color-border:       #e0e0e0;
  --color-border-light: #f0f0f0;
  --color-bg:           #fafbfc;
  --color-surface:      #ffffff;

  /* 功能色 */
  --color-gold:         #b8860b;
  --color-success:      #27ae60;
  --color-danger:       #c0392b;

  /* 字体 */
  --font-heading: "SimHei","黑体","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-body:    "SimSun","宋体","Noto Serif SC","Georgia",serif;
  --font-en:      "Georgia","Times New Roman",serif;
  --font-mono:    "Consolas","Courier New",monospace;

  /* 字号 */
  --text-h1:   2rem;    /* 首页大标题 32px */
  --text-h2:   1.5rem;  /* 页面标题 24px */
  --text-h3:   1.25rem; /* 区块标题 20px */
  --text-h4:   1.0625rem; /* 子标题 17px */
  --text-body: 1.0625rem; /* 正文 17px */
  --text-sm:   0.9375rem; /* 摘要 15px */
  --text-xs:   0.8125rem; /* 元信息 13px */
  --text-2xs:  0.75rem;   /* 标签 12px */

  /* 间距 */
  --space-xs:  0.25rem;
  --space-sm:  0.5rem;
  --space-md:  1rem;
  --space-lg:  1.5rem;
  --space-xl:  2rem;
  --space-2xl: 3rem;
  --space-3xl: 4rem;

  /* 尺寸 */
  --max-width-page:   1100px;
  --max-width-article: 780px;
  --card-width:       340px;
  --navbar-height:    60px;

  /* 圆角 */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;

  /* 阴影 */
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.10);

  /* 过渡 */
  --transition: 0.2s ease;
}

/* ═══════════════ 全局重置 ═══════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  font-size:var(--text-body);
  line-height:1.85;
  color:var(--color-text);
  background:var(--color-bg);
  -webkit-font-smoothing:antialiased;
}

/* ═══════════════ 导航栏 .navbar ═══════════════ */
.navbar{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  height:var(--navbar-height);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--space-xl);
  position:sticky;top:0;z-index:100;
  box-shadow:var(--shadow-sm);
}
.navbar-brand{
  font-family:var(--font-en);
  font-size:1rem;font-weight:600;font-style:italic;
  color:var(--color-primary);
  text-decoration:none;letter-spacing:0.5px;
  display:flex;align-items:center;gap:var(--space-sm);
}
.navbar-brand .brand-icon{font-size:1.3rem;font-style:normal}
.navbar-links{display:flex;gap:var(--space-xl);align-items:center}
.navbar-links a{
  font-family:var(--font-heading);
  font-size:var(--text-xs);font-weight:500;
  color:var(--color-text-sub);text-decoration:none;
  transition:color var(--transition);
  padding:var(--space-xs) 0;
  border-bottom:2px solid transparent;
}
.navbar-links a:hover,.navbar-links a.active{
  color:var(--color-accent);
  border-bottom-color:var(--color-accent-light);
}
/* 汉堡菜单按钮（移动端） */
.navbar-toggle{
  display:none;background:none;border:none;cursor:pointer;
  font-size:1.5rem;color:var(--color-text-sub);padding:var(--space-sm);
}

/* ═══════════════ 页脚 .site-footer ═══════════════ */
.site-footer{
  background:var(--color-primary);
  color:rgba(255,255,255,0.7);
  text-align:center;padding:var(--space-2xl) var(--space-xl);
  margin-top:var(--space-3xl);
  font-size:var(--text-xs);
  line-height:1.8;
}
.site-footer a{color:rgba(255,255,255,0.9);text-decoration:none}
.site-footer a:hover{color:#fff;text-decoration:underline}
.site-footer .footer-brand{
  color:#fff;font-family:var(--font-en);
  font-size:1rem;font-style:italic;margin-bottom:var(--space-sm);
}

/* ═══════════════ 容器 .container ═══════════════ */
.container{
  max-width:var(--max-width-page);
  margin:0 auto;padding:0 var(--space-xl);
}

/* ═══════════════ 按钮 .btn ═══════════════ */
.btn{
  display:inline-flex;align-items:center;gap:var(--space-sm);
  font-family:var(--font-heading);font-weight:600;
  border:none;cursor:pointer;text-decoration:none;
  border-radius:var(--radius-sm);transition:all var(--transition);
  white-space:nowrap;
}
.btn-primary{
  background:var(--color-primary);color:#fff;
  padding:0.7rem 1.8rem;font-size:var(--text-xs);
}
.btn-primary:hover{background:var(--color-primary-light);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-outline{
  background:transparent;color:var(--color-primary);
  border:2px solid var(--color-primary);
  padding:0.6rem 1.6rem;font-size:var(--text-xs);
}
.btn-outline:hover{background:var(--color-primary);color:#fff}
.btn-gold{
  background:var(--color-gold);color:#fff;
  padding:0.7rem 2rem;font-size:var(--text-sm);
}
.btn-gold:hover{background:#9a6f0a;transform:translateY(-1px);box-shadow:var(--shadow-md)}

/* ═══════════════ 论文卡片 .paper-card ═══════════════ */
.paper-card{
  background:var(--color-surface);
  border-radius:var(--radius-md);padding:var(--space-lg);
  box-shadow:var(--shadow-sm);
  transition:all var(--transition);
  display:flex;flex-direction:column;gap:var(--space-sm);
}
.paper-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-lg);
}
.paper-card .card-journal{
  font-family:var(--font-en);font-size:var(--text-2xs);
  color:var(--color-accent);font-style:italic;
}
.paper-card .card-title{
  font-family:var(--font-heading);font-size:var(--text-h4);
  font-weight:700;line-height:1.5;
}
.paper-card .card-title a{
  color:var(--color-text);text-decoration:none;
  transition:color var(--transition);
}
.paper-card .card-title a:hover{color:var(--color-accent)}
.paper-card .card-authors{
  font-size:var(--text-xs);color:var(--color-text-sub);
}
.paper-card .card-abstract{
  font-size:var(--text-xs);color:var(--color-text-light);
  line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.paper-card .card-tags{
  display:flex;flex-wrap:wrap;gap:var(--space-xs);
}
.paper-card .card-tag{
  font-family:var(--font-heading);font-size:var(--text-2xs);
  color:var(--color-accent);background:#eef5fb;
  padding:2px 10px;border-radius:12px;
}
.paper-card .card-meta{
  font-family:var(--font-en);font-size:var(--text-2xs);
  color:var(--color-text-light);
  display:flex;justify-content:space-between;align-items:center;
}

/* ═══════════════ 搜索栏 .search-bar ═══════════════ */
.search-bar{
  display:flex;gap:0;max-width:600px;width:100%;
  border-radius:var(--radius-md);overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.search-bar input{
  flex:1;padding:0.7rem 1rem;font-size:var(--text-sm);
  font-family:var(--font-body);
  border:2px solid var(--color-border);border-right:none;
  border-radius:var(--radius-md) 0 0 var(--radius-md);
  outline:none;transition:border-color var(--transition);
}
.search-bar input:focus{border-color:var(--color-accent-light)}
.search-bar button{
  padding:0.7rem 1.5rem;background:var(--color-primary);color:#fff;
  border:none;cursor:pointer;font-size:var(--text-sm);
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  transition:background var(--transition);
}
.search-bar button:hover{background:var(--color-primary-light)}

/* ═══════════════ 筛选面板 .filter-panel ═══════════════ */
.filter-panel{
  background:var(--color-surface);border-radius:var(--radius-md);
  padding:var(--space-lg);box-shadow:var(--shadow-sm);
  width:240px;flex-shrink:0;
}
.filter-panel h3{
  font-family:var(--font-heading);font-size:var(--text-sm);
  font-weight:700;margin-bottom:var(--space-md);
}
.filter-group{margin-bottom:var(--space-lg)}
.filter-group-label{
  font-family:var(--font-heading);font-size:var(--text-xs);
  font-weight:600;color:var(--color-text-sub);
  margin-bottom:var(--space-sm);display:block;
}
.filter-group label{
  display:flex;align-items:center;gap:var(--space-sm);
  font-size:var(--text-xs);color:var(--color-text);
  padding:4px 0;cursor:pointer;
}
.filter-group input[type="checkbox"]{accent-color:var(--color-accent)}
.filter-reset{
  font-family:var(--font-heading);font-size:var(--text-2xs);
  color:var(--color-accent);cursor:pointer;background:none;border:none;
  text-decoration:underline;
}

/* ═══════════════ 上传区 .upload-zone ═══════════════ */
.upload-zone{
  border:2px dashed var(--color-border);
  border-radius:var(--radius-lg);
  padding:var(--space-3xl) var(--space-2xl);
  text-align:center;cursor:pointer;
  transition:all var(--transition);
  background:var(--color-surface);
}
.upload-zone:hover,.upload-zone.dragover{
  border-color:var(--color-accent-light);
  background:#f0f7fc;
}
.upload-zone .upload-icon{font-size:3rem;margin-bottom:var(--space-md)}
.upload-zone .upload-title{
  font-family:var(--font-heading);font-size:var(--text-h4);
  font-weight:600;margin-bottom:var(--space-sm);
}
.upload-zone .upload-hint{
  font-size:var(--text-xs);color:var(--color-text-light);
}
.upload-zone input[type="file"]{display:none}

/* ═══════════════ 侧边目录 .article-toc ═══════════════ */
.article-toc{
  position:sticky;top:calc(var(--navbar-height) + var(--space-xl));
  width:200px;flex-shrink:0;max-height:calc(100vh - 120px);
  overflow-y:auto;font-size:var(--text-xs);
}
.article-toc-title{
  font-family:var(--font-heading);font-weight:700;
  font-size:var(--text-xs);margin-bottom:var(--space-md);
  color:var(--color-text);
}
.article-toc a{
  display:block;padding:4px 0;color:var(--color-text-sub);
  text-decoration:none;border-left:2px solid transparent;
  padding-left:var(--space-md);transition:all var(--transition);
}
.article-toc a:hover,.article-toc a.active{
  color:var(--color-accent);border-left-color:var(--color-accent);
}
.article-toc a.toc-l2{padding-left:var(--space-xl)}

/* ═══════════════ 分布局 .layout ═══════════════ */
.layout-with-sidebar{
  display:flex;gap:var(--space-xl);
  max-width:var(--max-width-page);
  margin:0 auto;padding:var(--space-xl);
}
.layout-main{flex:1;min-width:0}

/* ═══════════════ Hero区域（首页） ═══════════════ */
.hero{
  text-align:center;padding:var(--space-3xl) var(--space-xl);
  background:linear-gradient(135deg, #f0f4f8 0%, #e8eef4 50%, #f5f2ed 100%);
}
.hero .hero-journal{
  font-family:var(--font-en);font-size:var(--text-xs);
  color:var(--color-accent);font-style:italic;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:var(--space-md);
}
.hero .hero-title{
  font-family:var(--font-heading);font-size:var(--text-h1);
  font-weight:700;color:var(--color-primary);line-height:1.3;
  margin-bottom:var(--space-md);max-width:600px;margin-left:auto;margin-right:auto;
}
.hero .hero-subtitle{
  font-size:var(--text-sm);color:var(--color-text-sub);
  max-width:500px;margin:0 auto var(--space-xl) auto;
}
.hero .hero-actions{display:flex;gap:var(--space-md);justify-content:center;flex-wrap:wrap}

/* ═══════════════ 区块标题 .section-heading ═══════════════ */
.section-heading{
  font-family:var(--font-heading);font-size:var(--text-h2);
  font-weight:700;color:var(--color-text);
  margin-bottom:var(--space-xl);text-align:center;
}
.section-heading::after{
  content:'';display:block;width:60px;height:3px;
  background:var(--color-accent-light);margin:var(--space-sm) auto 0;
}

/* ═══════════════ 卡片网格 .card-grid ═══════════════ */
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--card-width),1fr));
  gap:var(--space-lg);
}

/* ═══════════════ 功能展示区 .features ═══════════════ */
.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--space-xl);
  text-align:center;
}
.feature-item .feature-icon{font-size:2.5rem;margin-bottom:var(--space-md)}
.feature-item .feature-title{
  font-family:var(--font-heading);font-size:var(--text-h4);
  font-weight:700;margin-bottom:var(--space-sm);
}
.feature-item .feature-desc{
  font-size:var(--text-xs);color:var(--color-text-sub);
  line-height:1.6;
}

/* ═══════════════ 分页器 .pagination ═══════════════ */
.pagination{
  display:flex;justify-content:center;gap:var(--space-sm);
  margin-top:var(--space-xl);
}
.pagination a,.pagination span{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:var(--radius-sm);
  font-family:var(--font-heading);font-size:var(--text-xs);
  text-decoration:none;transition:all var(--transition);
}
.pagination a{color:var(--color-text);border:1px solid var(--color-border)}
.pagination a:hover{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.pagination .current{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}

/* ═══════════════ 设置面板 .settings-panel ═══════════════ */
.settings-panel{
  display:flex;gap:var(--space-xl);justify-content:center;
  flex-wrap:wrap;margin-top:var(--space-lg);
}
.settings-group{text-align:center}
.settings-group .settings-label{
  font-family:var(--font-heading);font-size:var(--text-xs);
  font-weight:600;color:var(--color-text-sub);margin-bottom:var(--space-sm);
}
.settings-group select,.settings-group input{
  font-family:var(--font-body);font-size:var(--text-xs);
  padding:0.4rem 0.8rem;border:1px solid var(--color-border);
  border-radius:var(--radius-sm);outline:none;
}

/* ═══════════════ 预览区 .preview-area ═══════════════ */
.preview-area{
  margin-top:var(--space-xl);border:1px solid var(--color-border);
  border-radius:var(--radius-md);overflow:hidden;
  background:var(--color-surface);min-height:400px;
  box-shadow:var(--shadow-md);
}
.preview-area iframe{
  width:100%;height:600px;border:none;
}
.preview-placeholder{
  display:flex;align-items:center;justify-content:center;
  height:400px;color:var(--color-text-light);font-size:var(--text-sm);
}

/* ═══════════════ 文章内容样式（详情页 + 预览） ═══════════════ */
.article-content{
  max-width:var(--max-width-article);margin:0 auto;padding:var(--space-xl) 0;
}
.article-content .article-header{text-align:center}
.article-content .article-title{
  font-family:var(--font-heading);font-size:var(--text-h2);
  font-weight:700;line-height:1.4;margin-bottom:var(--space-md);
}
.article-content .article-subtitle{
  font-family:var(--font-body);font-size:var(--text-sm);
  color:var(--color-text-sub);margin-bottom:var(--space-lg);
}
.article-content .authors{
  display:flex;justify-content:center;flex-wrap:wrap;gap:.3em .8em;
  font-size:var(--text-sm);margin-bottom:var(--space-md);
}
.article-content .article-meta{
  display:flex;justify-content:center;gap:var(--space-lg);
  font-size:var(--text-xs);color:var(--color-text-light);
  margin-bottom:var(--space-xl);flex-wrap:wrap;
}
.article-content .abstract{
  background:linear-gradient(135deg,#f8f9fb,#f0f2f5);
  border-left:4px solid var(--color-accent-light);
  padding:var(--space-lg) var(--space-xl);margin-bottom:var(--space-xl);
  border-radius:0 var(--radius-md) var(--radius-md) 0;
}
.article-content .abstract h2{
  font-family:var(--font-heading);font-size:var(--text-xs);
  font-weight:700;color:var(--color-primary);margin-bottom:var(--space-sm);
}
.article-content .abstract p{font-size:var(--text-sm);text-indent:0}
.article-content .keywords{
  font-size:var(--text-xs);color:var(--color-text-sub);margin-bottom:var(--space-xl);
}
.article-content .section-title{
  font-family:var(--font-heading);font-weight:700;
}
.article-content .level-1>.section-title{
  font-size:1.375rem;margin:var(--space-xl) 0 var(--space-md) 0;
  padding-bottom:var(--space-sm);border-bottom:1px solid var(--color-border-light);
}
.article-content .level-2>.section-title{
  font-size:1.125rem;margin:var(--space-lg) 0 var(--space-sm) 0;
}
.article-content p{text-indent:2em;margin:0.6rem 0}
.article-content .data-table{width:100%;border-collapse:collapse}
.article-content .data-table thead{background:var(--color-primary);color:#fff}
.article-content .data-table th{
  font-family:var(--font-heading);font-size:var(--text-xs);
  padding:0.6rem 1rem;text-align:left;
}
.article-content .data-table td{
  padding:0.5rem 1rem;font-size:var(--text-xs);
  border-bottom:1px solid var(--color-border-light);
}
.article-content .data-table tbody tr:nth-child(even){background:#f8f9fa}
.article-content .table-wrap{overflow-x:auto;margin:var(--space-lg) 0}
.article-content .table-caption{
  font-size:var(--text-xs);margin-bottom:var(--space-sm);
  font-weight:600;color:var(--color-primary);
}
.article-content .figure{
  text-align:center;margin:var(--space-lg) 0;
  padding:var(--space-md);border:1px solid var(--color-border);
  border-radius:var(--radius-md);background:var(--color-surface);
}
.article-content .figure figcaption{font-size:var(--text-xs);margin-top:var(--space-sm);color:var(--color-text-sub)}
.article-content .formula-wrap{margin:var(--space-lg) 0;text-align:center;padding:var(--space-md)}
.article-content .references{
  margin-top:var(--space-2xl);padding-top:var(--space-lg);
  border-top:2px solid var(--color-border);
}
.article-content .references h2{
  font-family:var(--font-heading);font-size:var(--text-h3);
  font-weight:700;margin-bottom:var(--space-lg);
}
.article-content .references ol{list-style:none;counter-reset:ref}
.article-content .reference-item{
  font-size:var(--text-xs);line-height:1.7;margin-bottom:0.5rem;
  padding-left:2.2em;text-indent:-2.2em;color:var(--color-text-sub);
  counter-increment:ref;
}
.article-content .reference-item::before{
  content:"[" counter(ref) "] ";color:var(--color-primary);font-weight:600;
}

/* ═══════════════ 关于页面 ═══════════════ */
.about-section{
  max-width:var(--max-width-article);margin:0 auto;
  padding:var(--space-xl) 0;
}
.about-section h2{
  font-family:var(--font-heading);font-size:var(--text-h2);
  font-weight:700;margin:var(--space-xl) 0 var(--space-md) 0;
}
.about-section h3{
  font-family:var(--font-heading);font-size:var(--text-h3);
  font-weight:600;margin:var(--space-lg) 0 var(--space-sm) 0;
}
.about-section p{
  font-size:var(--text-sm);line-height:1.85;margin-bottom:var(--space-md);
}
.about-steps{
  display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-lg);
  margin:var(--space-xl) 0;text-align:center;
}
.about-step .step-number{
  width:48px;height:48px;border-radius:50%;
  background:var(--color-primary);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-en);font-size:var(--text-h3);font-weight:700;
  margin-bottom:var(--space-md);
}
.about-step .step-title{
  font-family:var(--font-heading);font-size:var(--text-h4);font-weight:700;
}
.about-step .step-desc{
  font-size:var(--text-xs);color:var(--color-text-sub);margin-top:var(--space-sm);
}

/* ═══════════════ 团队卡片 .team-cards ═══════════════ */
.team-cards{display:flex;gap:var(--space-lg);justify-content:center;flex-wrap:wrap}
.team-card{
  background:var(--color-surface);border-radius:var(--radius-md);
  padding:var(--space-xl);text-align:center;width:200px;
  box-shadow:var(--shadow-sm);
}
.team-card .member-avatar{
  width:64px;height:64px;border-radius:50%;
  background:var(--color-border-light);
  margin:0 auto var(--space-md);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;
}
.team-card .member-name{font-family:var(--font-heading);font-weight:700;font-size:var(--text-sm)}
.team-card .member-role{font-size:var(--text-xs);color:var(--color-text-sub);margin-top:4px}

/* ═══════════════ 返回顶部 ═══════════════ */
.back-to-top{
  position:fixed;bottom:var(--space-xl);right:var(--space-xl);
  width:44px;height:44px;border-radius:50%;
  background:var(--color-primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;cursor:pointer;border:none;
  box-shadow:var(--shadow-md);opacity:0;visibility:hidden;
  transition:all var(--transition);z-index:99;
}
.back-to-top.visible{opacity:1;visibility:visible}
.back-to-top:hover{background:var(--color-accent-light);transform:translateY(-2px)}

/* ═══════════════ 响应式 ═══════════════ */
@media (max-width:900px){
  .features,.about-steps{grid-template-columns:1fr}
  .card-grid{grid-template-columns:1fr}
  .layout-with-sidebar{flex-direction:column}
  .filter-panel{width:100%;display:flex;flex-wrap:wrap;gap:var(--space-md)}
  .filter-group{flex:1;min-width:120px}
  .article-toc{display:none}
  :root{--text-h1:1.5rem;--text-h2:1.3rem}
  .settings-panel{flex-direction:column;align-items:center}
}
@media (max-width:640px){
  .navbar-links{display:none;position:absolute;top:var(--navbar-height);
    left:0;right:0;background:var(--color-surface);flex-direction:column;
    padding:var(--space-md);box-shadow:var(--shadow-md);
  }
  .navbar-links.open{display:flex}
  .navbar-toggle{display:block}
  .hero{padding:var(--space-2xl) var(--space-md)}
  .hero .hero-title{font-size:1.3rem}
  .upload-zone{padding:var(--space-2xl) var(--space-md)}
  .container{padding:0 var(--space-md)}
}

</style>
</head>
<body>

<!-- ═══════════════ 顶部导航 ═══════════════ -->
<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <span class="brand-icon">📰</span>
计算机学报  </a>
  <button class="navbar-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">☰</button>
  <div class="navbar-links">
    <a href="index.html"   class="">首页</a>
    <a href="browse.html"  class="">论文浏览</a>
    <a href="upload.html"  class="active">上传转换</a>
    <a href="about.html"   class="">关于</a>
  </div>
</nav>

<!-- ═══════════════ 页面主体 ═══════════════ -->

<!-- ═══════════════ 上传页标题 ═══════════════ -->
<section style="background:linear-gradient(135deg,#f0f4f8,#e8eef4);padding:var(--space-2xl) 0 var(--space-xl)">
  <div class="container">
    <h1 style="font-family:var(--font-heading);font-size:var(--text-h2);font-weight:700;text-align:center;margin-bottom:var(--space-sm)">论文上传与转换</h1>
    <p style="text-align:center;color:var(--color-text-sub);font-size:var(--text-sm)">
      上传 JATS XML 格式的学术论文，即时预览排版效果，调整样式后导出
    </p>
  </div>
</section>

<div class="container" style="padding-top:var(--space-xl);padding-bottom:var(--space-3xl)">

  <!-- ── 上传区域 ── -->
  <div class="upload-zone" id="upload-zone">
    <div class="upload-icon">📄</div>
    <div class="upload-title">拖拽 JATS XML 文件到此处</div>
    <div class="upload-hint">或点击此处选择文件 &nbsp;·&nbsp; 支持 .xml 格式 &nbsp;·&nbsp; JATS 1.0/1.1 标准</div>
    <input type="file" accept=".xml" id="file-input">
  </div>

  <div id="upload-status" style="text-align:center;margin-top:var(--space-md);font-size:var(--text-sm)"></div>

  <!-- ── 排版设置 ── -->
  <div class="settings-panel">
    <div class="settings-group">
      <div class="settings-label">排版栏数</div>
      <label style="margin-right:var(--space-md);cursor:pointer">
        <input type="radio" name="columns" value="single" checked> 单栏
      </label>
      <label style="cursor:pointer">
        <input type="radio" name="columns" value="double"> 双栏
      </label>
    </div>
    <div class="settings-group">
      <div class="settings-label">正文字号</div>
      <select>
        <option value="small">小号 (15px)</option>
        <option value="medium" selected>中号 (17px)</option>
        <option value="large">大号 (19px)</option>
      </select>
    </div>
    <div class="settings-group">
      <div class="settings-label">期刊风格</div>
      <select>
        <option value="elsevier" selected>Elsevier 风格</option>
        <option value="springer">Springer 风格</option>
        <option value="ieee">IEEE 风格</option>
      </select>
    </div>
  </div>

  <!-- ── 操作按钮 ── -->
  <div style="text-align:center;margin-top:var(--space-xl);display:flex;gap:var(--space-md);justify-content:center;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="handleConvert()">开始转换</button>
    <button class="btn btn-outline" onclick="handlePreview()">预览效果</button>
    <button class="btn btn-outline" onclick="handleDownload()">下载 HTML</button>
  </div>

  <!-- ── 预览区 ── -->
  <div class="preview-area" style="margin-top:var(--space-2xl)">
    <div class="preview-placeholder" id="preview-placeholder">
      上传并转换 JATS XML 后，排版效果将在此处实时预览
    </div>
    <iframe id="preview-frame" style="display:none;width:100%;height:600px;border:none" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<script>
// 上传页额外交互（在 platform.js 基础上）
function handleConvert() {
  var fileInput = document.getElementById('file-input');
  var status = document.getElementById('upload-status');
  if (!fileInput.files || fileInput.files.length === 0) {
    status.innerHTML = '<span style="color:var(--color-danger)">请先选择要上传的 JATS XML 文件</span>';
    return;
  }
  status.innerHTML = '<span style="color:var(--color-success)">正在转换... (实际部署时由后端处理)</span>';
  handlePreview();
}

function handlePreview() {
  var frame = document.getElementById('preview-frame');
  var placeholder = document.getElementById('preview-placeholder');
  // 实际部署时，这里会显示后端渲染的论文预览
  // 暂时展示提示信息
  var previewHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--color-text-sub);font-size:var(--text-sm);text-align:center;padding:var(--space-xl)">' +
    '预览功能已就绪<br><small>实际部署时，上传的XML将由Python后端解析并在iframe中渲染论文排版效果</small></div>';
  frame.srcdoc = previewHTML;
  frame.style.display = 'block';
  placeholder.style.display = 'none';
}

function handleDownload() {
  var status = document.getElementById('upload-status');
  status.innerHTML = '<span style="color:var(--color-success)">HTML 下载功能已就绪（实际部署时触发下载）</span>';
}
</script>


<!-- ═══════════════ 页脚 ═══════════════ -->
<footer class="site-footer">
  <div class="footer-brand">计算机学报</div>
  <p>基于 JATS XML 的学术期刊智能排版与展示平台</p>
  <p>© 2024 期刊大赛·选题2 &nbsp;|&nbsp; <a href="https://github.com/zzzzzzzzu0406/jats2pdf" target="_blank">GitHub</a></p>
</footer>

<!-- ═══════════════ 返回顶部 ═══════════════ -->
<button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="返回顶部">↑</button>

<!-- ═══════════════ 平台脚本 ═══════════════ -->
<script>
/**
 * 学术期刊优化平台 — 交互脚本
 * =============================
 * 功能:
 *  - 返回顶部按钮显隐
 *  - 移动端导航汉堡菜单
 *  - 搜索过滤论文列表
 *  - 上传区拖拽交互
 *  - 论文详情侧边目录高亮
 *  - 筛选面板重置
 */

// ── 返回顶部按钮 ──
(function() {
  var btn = document.querySelector('.back-to-top');
  if (!btn) return;
  window.addEventListener('scroll', function() {
    btn.classList.toggle('visible', window.scrollY > 400);
  });
})();

// ── 移动端导航 ──
(function() {
  var toggle = document.querySelector('.navbar-toggle');
  var links = document.querySelector('.navbar-links');
  if (!toggle || !links) return;
  toggle.addEventListener('click', function() {
    links.classList.toggle('open');
  });
  // 点击链接后关闭
  links.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() { links.classList.remove('open'); });
  });
})();

// ── 搜索过滤 ──
(function() {
  var searchInput = document.querySelector('.search-bar input');
  if (!searchInput) return;
  searchInput.addEventListener('input', function() {
    var query = this.value.toLowerCase().trim();
    var cards = document.querySelectorAll('.paper-card');
    var hasResults = false;
    cards.forEach(function(card) {
      var text = (card.textContent || '').toLowerCase();
      var match = !query || text.indexOf(query) !== -1;
      card.style.display = match ? '' : 'none';
      if (match) hasResults = true;
    });
    var noResults = document.getElementById('no-results');
    if (noResults) {
      noResults.style.display = hasResults ? 'none' : 'block';
    }
  });
})();

// ── 筛选面板 ──
(function() {
  var filterPanel = document.querySelector('.filter-panel');
  if (!filterPanel) return;

  var checkboxes = filterPanel.querySelectorAll('input[type="checkbox"]');
  var resetBtn = filterPanel.querySelector('.filter-reset');

  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      checkboxes.forEach(function(cb) { cb.checked = true; });
      filterCards();
    });
  }

  checkboxes.forEach(function(cb) {
    cb.addEventListener('change', filterCards);
  });

  function getActiveFilters() {
    var active = {};
    checkboxes.forEach(function(cb) {
      var group = cb.closest('.filter-group');
      if (!group) return;
      var label = group.querySelector('.filter-group-label');
      var groupName = label ? label.textContent.trim() : 'other';
      if (!active[groupName]) active[groupName] = [];
      if (cb.checked) active[groupName].push(cb.value);
    });
    return active;
  }

  function filterCards() {
    var filters = getActiveFilters();
    var cards = document.querySelectorAll('.paper-card');
    cards.forEach(function(card) {
      var visible = true;
      // 检查每个筛选组
      for (var group in filters) {
        var values = filters[group];
        if (values.length === 0) continue;
        var dataAttr = card.getAttribute('data-' + group.toLowerCase().replace(/\s+/g, '-'));
        if (dataAttr) {
          var cardValues = dataAttr.split(',');
          var match = values.some(function(v) { return cardValues.indexOf(v) !== -1; });
          if (!match) visible = false;
        }
      }
      card.style.display = visible ? '' : 'none';
    });
  }
})();

// ── 上传拖拽交互 ──
(function() {
  var uploadZone = document.querySelector('.upload-zone');
  if (!uploadZone) return;
  var fileInput = uploadZone.querySelector('input[type="file"]');
  var statusEl = document.getElementById('upload-status');

  // 点击触发文件选择
  uploadZone.addEventListener('click', function() {
    if (fileInput) fileInput.click();
  });

  // 拖拽事件
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function(evt) {
    uploadZone.addEventListener(evt, function(e) {
      e.preventDefault();
      e.stopPropagation();
    });
  });

  ['dragenter', 'dragover'].forEach(function(evt) {
    uploadZone.addEventListener(evt, function() {
      uploadZone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(function(evt) {
    uploadZone.addEventListener(evt, function() {
      uploadZone.classList.remove('dragover');
    });
  });

  uploadZone.addEventListener('drop', function(e) {
    var files = e.dataTransfer.files;
    handleFiles(files);
  });

  if (fileInput) {
    fileInput.addEventListener('change', function() {
      handleFiles(this.files);
    });
  }

  function handleFiles(files) {
    if (!files || files.length === 0) return;
    var file = files[0];
    if (!file.name.endsWith('.xml')) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--color-danger)">请上传 .xml 格式的 JATS 文件</span>';
      return;
    }
    if (statusEl) {
      statusEl.innerHTML = '<span style="color:var(--color-success)">已选择: ' + file.name + ' (' + (file.size/1024).toFixed(1) + ' KB)</span>';
    }
    // 读取文件内容用于预览
    var reader = new FileReader();
    reader.onload = function(e) {
      var content = e.target.result;
      // 可以将内容传给预览区（iframe srcdoc）或触发转换
      updatePreview(content);
    };
    reader.readAsText(file);
  }

  function updatePreview(xmlContent) {
    var previewFrame = document.querySelector('.preview-area iframe');
    var placeholder = document.querySelector('.preview-placeholder');
    if (previewFrame) {
      // 简单预览：显示XML源码（实际应由后端解析后渲染）
      previewFrame.srcdoc = '<pre style="padding:16px;font-size:12px;white-space:pre-wrap;word-break:break-all">' +
        xmlContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
        '</pre>';
      if (placeholder) placeholder.style.display = 'none';
      previewFrame.style.display = 'block';
    }
  }
})();

// ── 论文目录高亮（滚动监听） ──
(function() {
  var tocLinks = document.querySelectorAll('.article-toc a');
  if (tocLinks.length === 0) return;

  var headings = [];
  tocLinks.forEach(function(link) {
    var href = link.getAttribute('href');
    if (href && href.startsWith('#')) {
      var el = document.querySelector(href);
      if (el) headings.push({ el: el, link: link });
    }
  });

  if (headings.length === 0) return;

  window.addEventListener('scroll', function() {
    var scrollPos = window.scrollY + 120;
    var current = null;
    headings.forEach(function(item) {
      if (item.el.offsetTop <= scrollPos) {
        current = item;
      }
    });
    tocLinks.forEach(function(link) { link.classList.remove('active'); });
    if (current) current.link.classList.add('active');
  });
})();

// ── 列表页无结果提示 ──
(function() {
  var noResults = document.getElementById('no-results');
  if (noResults) noResults.style.display = 'none';
})();

</script>
</body>
