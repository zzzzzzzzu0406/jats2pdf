{% extends "base.html" %}
{% block title %}上传转换 — 学术期刊优化平台{% endblock %}

{% block content %}

<!-- ═══════════════ 上传页标题 ═══════════════ -->
<section class="upload-hero">
  <div class="container">
    <h1>论文上传与转换</h1>
    <p>
      上传 JATS XML，或上传包含 XML 与图片的 ZIP 资源包，即时预览并导出
    </p>
  </div>
</section>

<div class="container upload-page">

  <!-- ── 上传区域 ── -->
  <form id="upload-form" novalidate>
    <label class="upload-zone" id="upload-zone" for="file-input" tabindex="0">
      <span class="upload-icon" aria-hidden="true">📄</span>
      <span class="upload-title">拖拽 JATS XML 或资源 ZIP 到此处</span>
      <span class="upload-hint">支持 .xml，或包含 1 个 XML 与 JPG/PNG 等图片的 .zip 资源包</span>
      <span class="upload-choose">选择文件</span>
      <input type="file" accept=".xml,.zip,application/xml,text/xml,application/zip" id="file-input">
    </label>

    <section class="selected-file" id="selected-file" hidden aria-label="已选文件">
      <div class="selected-file-icon" aria-hidden="true">XML</div>
      <div class="selected-file-info">
        <strong id="selected-file-name"></strong>
        <span id="selected-file-meta"></span>
      </div>
      <button type="button" class="btn btn-outline selected-file-remove" id="btn-remove-file">移除</button>
    </section>

    <div id="upload-status" class="upload-status" role="status" aria-live="polite"></div>

    <!-- ── 排版设置 ── -->
    <fieldset class="settings-panel">
      <legend>排版设置</legend>
      <div class="settings-group">
        <div class="settings-label">排版栏数</div>
        <div class="settings-options">
          <label><input type="radio" name="columns" value="single" checked> 单栏</label>
          <label><input type="radio" name="columns" value="double"> 双栏</label>
        </div>
      </div>
      <div class="settings-group">
        <label class="settings-label" for="setting-font-style">字体风格</label>
        <select id="setting-font-style">
          <option value="academic" selected>学术宋体</option>
          <option value="modern">现代无衬线</option>
          <option value="international">国际期刊</option>
        </select>
      </div>
      <div class="settings-group">
        <label class="settings-label" for="setting-font-size">正文字号</label>
        <select id="setting-font-size">
          <option value="small">小号 (15px)</option>
          <option value="medium" selected>中号 (17px)</option>
          <option value="large">大号 (19px)</option>
        </select>
      </div>
      <div class="settings-group">
        <label class="settings-label" for="setting-ref-style">参考文献格式</label>
        <select id="setting-ref-style">
          <option value="elsevier" selected>Elsevier</option>
          <option value="gbt7714">GB/T 7714</option>
        </select>
      </div>
    </fieldset>

    <!-- ── 操作按钮 ── -->
    <div class="upload-actions">
      <button type="submit" class="btn btn-primary" id="btn-convert" disabled>开始转换</button>
      <button type="button" class="btn btn-outline" id="btn-preview" disabled>预览效果</button>
      <button type="button" class="btn btn-outline" id="btn-download-html" disabled>下载 HTML</button>
      <button type="button" class="btn btn-outline" id="btn-download-pdf" disabled>下载 PDF</button>
    </div>
  </form>

  <!-- ── 加载指示器 ── -->
  <div id="loading-indicator" class="loading-indicator" hidden aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <p id="loading-text">正在转换中...（含公式渲染可能需要数十秒）</p>
  </div>

  <!-- ── 预览区 ── -->
  <div class="preview-area upload-preview">
    <div class="preview-placeholder" id="preview-placeholder">
      <div class="preview-placeholder-content">
        <div class="preview-placeholder-icon" aria-hidden="true">📄</div>
        <div>上传并转换 JATS XML 后，排版效果将在此处实时预览</div>
      </div>
    </div>
    <div id="preview-container" hidden>
      <div class="preview-toolbar">
        <span>📋 排版预览</span>
        <small>可在上方调整栏数、字号、风格后实时刷新</small>
      </div>
      <iframe id="preview-frame" title="论文排版预览" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>
</div>

<script>
// ── 上传页交互逻辑 ──
var currentArticleId = null;
var currentFile = null;
var isConverting = false;
var previewRequestId = 0;

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function resetPreview() {
  var frame = document.getElementById('preview-frame');
  var placeholder = document.getElementById('preview-placeholder');
  var container = document.getElementById('preview-container');
  previewRequestId += 1;
  if (frame) {
    frame.removeAttribute('srcdoc');
    frame.style.height = '';
  }
  if (container) container.hidden = true;
  if (placeholder) placeholder.hidden = false;
}

function selectUploadFile(file) {
  if (!file) return false;
  var lowerName = file.name.toLowerCase();
  var isXml = lowerName.endsWith('.xml');
  var isZip = lowerName.endsWith('.zip');
  var maxBytes = isZip ? 50 * 1024 * 1024 : 10 * 1024 * 1024;
  if (!isXml && !isZip) {
    clearSelectedFile();
    showStatus('请选择 .xml 或 .zip 格式的 JATS 文件', 'danger');
    return false;
  }
  if (file.size > maxBytes) {
    clearSelectedFile();
    showStatus(isZip ? 'ZIP 资源包不能超过 50 MB' : 'XML 文件不能超过 10 MB', 'danger');
    return false;
  }

  currentFile = file;
  currentArticleId = null;
  setButtonsEnabled(false);
  resetPreview();

  var card = document.getElementById('selected-file');
  var icon = card ? card.querySelector('.selected-file-icon') : null;
  if (icon) icon.textContent = isZip ? 'ZIP' : 'XML';
  document.getElementById('selected-file-name').textContent = file.name;
  document.getElementById('selected-file-meta').textContent =
    (isZip ? 'ZIP 资源包' : 'JATS XML') + ' · ' + formatFileSize(file.size);
  if (card) card.hidden = false;
  document.getElementById('btn-convert').disabled = false;
  showStatus('文件已就绪，请确认排版设置后开始转换', 'success');
  return true;
}

function clearSelectedFile() {
  currentFile = null;
  currentArticleId = null;
  var input = document.getElementById('file-input');
  if (input) input.value = '';
  var card = document.getElementById('selected-file');
  if (card) card.hidden = true;
  document.getElementById('btn-convert').disabled = true;
  setButtonsEnabled(false);
  resetPreview();
  showStatus('已移除文件，可以重新选择', 'info');
}

// 获取当前设置
function getSettings() {
  var columns = document.querySelector('input[name="columns"]:checked');
  var fontStyle = document.getElementById('setting-font-style');
  var fontSize = document.getElementById('setting-font-size');
  var refStyle = document.getElementById('setting-ref-style');
  return {
    two_column: columns ? columns.value === 'double' : false,
    font_style: fontStyle ? fontStyle.value : 'academic',
    font_size: fontSize ? fontSize.value : 'medium',
    ref_style: refStyle ? refStyle.value : 'elsevier'
  };
}

// 设置变更时自动刷新预览
function onSettingsChange() {
  if (currentArticleId && !isConverting) {
    handlePreview();
  }
}

// 显示/隐藏加载状态
function showLoading(show, message) {
  var spinner = document.getElementById('loading-indicator');
  var text = document.getElementById('loading-text');
  if (text && message) text.textContent = message;
  if (spinner) spinner.hidden = !show;
}

// 启用/禁用按钮
function setButtonsEnabled(enabled) {
  ['btn-preview', 'btn-download-html', 'btn-download-pdf'].forEach(function(id) {
    var btn = document.getElementById(id);
    if (btn) btn.disabled = !enabled;
  });
}

function setConversionBusy(busy) {
  isConverting = busy;
  var fileInput = document.getElementById('file-input');
  var removeButton = document.getElementById('btn-remove-file');
  var convertButton = document.getElementById('btn-convert');
  var zone = document.getElementById('upload-zone');
  if (fileInput) fileInput.disabled = busy;
  if (removeButton) removeButton.disabled = busy;
  if (convertButton) convertButton.disabled = busy || !currentFile;
  if (zone) {
    zone.classList.toggle('is-disabled', busy);
    zone.setAttribute('aria-busy', busy ? 'true' : 'false');
  }
  if (busy) setButtonsEnabled(false);
  showLoading(busy, '正在上传并解析论文…（含公式渲染可能需要数十秒）');
}

// 上传并转换
function handleConvert(event) {
  if (event) event.preventDefault();
  if (isConverting) return;
  // 优先使用拖拽选择的文件，其次使用 file input
  var file = currentFile;
  if (!file) {
    var fileInput = document.getElementById('file-input');
    if (!fileInput.files || fileInput.files.length === 0) {
      showStatus('请先选择 JATS XML 或 ZIP 资源包', 'danger');
      return;
    }
    file = fileInput.files[0];
  }

  showStatus('正在上传并转换...', 'info');
  setConversionBusy(true);

  var formData = new FormData();
  formData.append('file', file);

  fetch('/api/upload', { method: 'POST', body: formData })
    .then(function(resp) {
      if (!resp.ok) return resp.json().then(function(err) { throw new Error(err.detail || '上传失败'); });
      return resp.json();
    })
    .then(function(data) {
      currentArticleId = data.article_id;
      if (data.lang === 'en') {
        document.getElementById('setting-ref-style').value = 'elsevier';
      }
      setConversionBusy(false);
      setButtonsEnabled(true);
      var assetText = data.asset_count ? '，已导入 ' + data.asset_count + ' 张图片' : '';
      showStatus('转换成功！共 ' + data.ref_count + ' 篇参考文献' + assetText, 'success');

      // 自动加载预览（使用设置面板的当前参数）
      handlePreview();
    })
    .catch(function(err) {
      setConversionBusy(false);
      showStatus('转换失败: ' + err.message, 'danger');
    });
}

// 预览（含当前设置）
function handlePreview() {
  if (!currentArticleId) {
    showStatus('请先上传并转换论文', 'danger');
    return;
  }

  var settings = getSettings();
  var params = new URLSearchParams({
    ref_style: settings.ref_style,
    two_column: settings.two_column,
    font_size: settings.font_size,
    font_style: settings.font_style
  });

  var requestId = ++previewRequestId;
  showLoading(true, '正在刷新排版预览…');
  var previewButton = document.getElementById('btn-preview');
  if (previewButton) previewButton.disabled = true;
  fetch('/api/articles/' + currentArticleId + '/preview?' + params.toString())
    .then(function(resp) {
      if (!resp.ok) throw new Error('预览加载失败');
      return resp.text();
    })
    .then(function(html) {
      if (requestId !== previewRequestId) return;
      var frame = document.getElementById('preview-frame');
      var placeholder = document.getElementById('preview-placeholder');
      var container = document.getElementById('preview-container');
      // 自适应高度：内容加载后调整 iframe 高度
      frame.onload = function() {
        try {
          var doc = frame.contentDocument || frame.contentWindow.document;
          var h = doc.documentElement.scrollHeight;
          frame.style.height = Math.max(800, h + 40) + 'px';
        } catch(e) {}
      };
      frame.srcdoc = html;
      container.hidden = false;
      placeholder.hidden = true;
    })
    .catch(function(err) {
      if (requestId !== previewRequestId) return;
      showStatus('预览失败: ' + err.message, 'danger');
    })
    .then(function() {
      if (requestId !== previewRequestId) return;
      showLoading(false);
      if (previewButton) previewButton.disabled = !currentArticleId;
    });
}

// 下载 HTML 或 PDF
function handleDownload(format) {
  if (!currentArticleId) {
    showStatus('请先上传并转换论文', 'danger');
    return;
  }

  var settings = getSettings();
  var params = new URLSearchParams({
    ref_style: settings.ref_style,
    two_column: settings.two_column,
    font_size: settings.font_size,
    font_style: settings.font_style
  });

  var url = '/api/articles/' + currentArticleId + '/' + format + '?' + params.toString();
  showStatus('正在生成 ' + format.toUpperCase() + '，下载即将开始...', 'success');

  // 触发浏览器下载
  var a = document.createElement('a');
  a.href = url;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// 状态显示
function showStatus(msg, type) {
  var status = document.getElementById('upload-status');
  if (!status) return;
  status.textContent = msg;
  status.className = 'upload-status status-' + (type || 'info');
}

document.getElementById('upload-form').addEventListener('submit', handleConvert);
document.getElementById('btn-preview').addEventListener('click', handlePreview);
document.getElementById('btn-download-html').addEventListener('click', function() { handleDownload('html'); });
document.getElementById('btn-download-pdf').addEventListener('click', function() { handleDownload('pdf'); });
document.getElementById('btn-remove-file').addEventListener('click', clearSelectedFile);
document.querySelectorAll('#upload-form input[name="columns"], #setting-font-style, #setting-font-size, #setting-ref-style').forEach(function(control) {
  control.addEventListener('change', onSettingsChange);
});

// 供 platform.js 的文件选择/拖拽统一调用；选中后只更新状态，不自动提交。
window.setUploadFile = function(file) {
  return selectUploadFile(file);
};
</script>

{% endblock %}
